# Supabase local project configuration (generated for the player analytics slice).
# Mirrors the target project ref. Remote is NOT touched by this repo — apply via CLI.

project_id = "weuwdzrgfoeomcauwgmv"

[api]
port = 54321
schemas = ["public", "graphql_public", "private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
shadow_port = 54320

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true

[functions]
enabled = true
verify_jwt = true

[functions.provision-player]
enabled = true
verify_jwt = true

[functions.recover-player]
enabled = true
verify_jwt = true

[functions.start-verified-session]
enabled = true
verify_jwt = true

[functions.submit-verified-score]
enabled = true
verify_jwt = true

[analytics]
enabled = false

[pgbouncer]
enabled = false
pool_mode = "transaction"
max_client_conn = 200
