name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      # 2026-08-04: wrangler-action 的自动安装在 pnpm workspace 下两条路都不通：
      #   1) 按 lockfile 检测到 pnpm-lock.yaml → 走 `pnpm add wrangler` → workspace 根目录
      #      报 ERR_PNPM_ADDING_TO_ROOT（15:32、23:28 两次失败）
      #   2) 显式 packageManager: npm → `npm i wrangler` → npm 扫描 node_modules/.pnpm
      #      虚拟存储时撞上 vite 的 package.json 里非标准字段 "dep-types": "link:./src/types"，
      #      报 EUNSUPPORTEDPROTOCOL（23:45 失败）
      # 改用 npx 直调：wrangler 独立装进 npm 缓存，不触碰项目依赖树，与 pnpm workspace 解耦。
      # 长期可选：把 wrangler 加入 devDependencies（pnpm add -D -w wrangler），
      # 则 wrangler-action 检测到已安装可跳过自动安装，但需先在系统终端更新 lockfile。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.86.0 pages deploy app/dist --project-name=jiazi-game --branch=main
