name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          pnpm build

      # 2026-08-04: wrangler-action 的自动安装在 pnpm workspace 下两条路都不通：
      #   1) 按 lockfile 检测到 pnpm-lock.yaml → 走 `pnpm add wrangler` → workspace 根目录
      #      报 ERR_PNPM_ADDING_TO_ROOT（15:32、23:28 两次失败）
      #   2) 显式 packageManager: npm → `npm i wrangler` → npm 扫描 node_modules/.pnpm
      #      虚拟存储时撞上 vite 的 package.json 里非标准字段 "dep-types": "link:./src/types"，
      #      报 EUNSUPPORTEDPROTOCOL（23:45 失败）
      # 改用 npx 直调：wrangler 独立装进 npm 缓存，不触碰项目依赖树，与 pnpm workspace 解耦。
      #
      # 2026-08-04 补充：CI secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）值开头带
      # UTF-8 BOM（U+FEFF），wrangler 构造 API 请求时 ByteString 转换报错
      # "character at index 7 has a value of 65279"（本地同版本 wrangler 用已存凭据可成功）。
      # 部署前用 tr 删除 BOM 字节（EF BB BF）作防御；根治请清理 GitHub secrets 源值。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\357\273\277')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\357\273\277')"
          npx --yes wrangler@3.90.0 pages deploy app/dist --project-name=jiazi-game --branch=main
