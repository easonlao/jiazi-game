name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      # 2026-08-04: wrangler-action 会按 lockfile 自动检测包管理器；项目统一为 pnpm 后
      # 它走 `pnpm add wrangler`，在 workspace 根目录报 ERR_PNPM_ADDING_TO_ROOT。
      # 显式 packageManager: npm 强制走 npm 安装路径（CI 环境一次性，不污染仓库），
      # 并用 wranglerVersion 固定版本避免每次动态解析。
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.86.0"
          command: pages deploy app/dist --project-name=jiazi-game --branch=main
